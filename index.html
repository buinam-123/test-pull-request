
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Simulation</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-container {
            width: 350px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #1e293b;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        #result {
            margin-top: 18px;
            padding: 12px;
            border-radius: 6px;
            display: none;
            overflow-wrap: anywhere;
            font-size: 14px;
        }

        .success {
            display: block !important;
            background: #dcfce7;
            color: #166534;
        }

        .error {
            display: block !important;
            background: #fee2e2;
            color: #991b1b;
        }

        .loading {
            display: block !important;
            background: #dbeafe;
            color: #1e40af;
        }

        .demo {
            margin-top: 20px;
            font-size: 13px;
            color: #64748b;
            line-height: 1.7;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <h2>Login</h2>

        <form id="loginForm">

            <div class="form-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Nhập username"
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Nhập password"
                >
            </div>

            <button type="submit" id="loginBtn">
                Login
            </button>

        </form>

        <div id="result"></div>

        <div class="demo">
            <strong>Tài khoản demo:</strong><br>
            Username: nam<br>
            Password: nam123<br><br>

            Username: admin<br>
            Password: 123456
        </div>

    </div>

    <script src="login.js"></script>

    <script>
        const form = document.getElementById("loginForm");
        const result = document.getElementById("result");
        const loginBtn = document.getElementById("loginBtn");

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            result.className = "loading";
            result.textContent = "Đang xác thực tài khoản...";
            loginBtn.disabled = true;

            try {
                const response = await login(username, password);

                result.className = "success";
                result.innerHTML = `
                    <strong>${response.message}</strong><br>
                    ID: ${response.data.id}<br>
                    Username: ${response.data.username}<br>
                    Role: ${response.data.role}
                `;

                localStorage.setItem("accessToken", response.token);

            } catch (error) {
                result.className = "error";
                result.textContent = error.message;

            } finally {
                loginBtn.disabled = false;
            }
        });
    </script>

</body>
</html>
